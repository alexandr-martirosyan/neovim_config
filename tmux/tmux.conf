# ~/.tmux.conf

# ---------- prefix ----------
# Default prefix is Ctrl+b (nothing to set). To switch later, e.g. to Ctrl+\ :
unbind C-b
set -g prefix 'C-\'
bind 'C-\' send-prefix

# ---------- colours and Neovim ----------
set -g default-terminal "tmux-256color"           # correct colours/features inside tmux
set -as terminal-features ",xterm-256color:RGB"   # true colour (iTerm2 reports xterm-256color)
set -sg escape-time 10                            # Esc reaches Neovim without delay
set -g focus-events on                            # Neovim notices when you switch panes/apps

# ---------- let Ctrl+Shift+key reach Neovim ----------
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys"

# ---------- general ----------
set -g mouse on                  # click panes, drag borders, scroll
set -g base-index 1              # windows start at 1 (key 1 is easier than 0)
setw -g pane-base-index 1
set -g renumber-windows on       # no gaps after closing a window
set -g history-limit 50000       # scrollback lines per pane
setw -g mode-keys vi             # copy mode uses vi keys (hjkl, /, v, y)

# ---------- splits like Neovim (<leader>ss / sd / sS / sD) ----------
bind s split-window -h  -c "#{pane_current_path}"   # side by side
bind d split-window -v  -c "#{pane_current_path}"   # top / bottom
bind S split-window -fh -c "#{pane_current_path}"   # full height, far right
bind D split-window -fv -c "#{pane_current_path}"   # full width, bottom
bind c new-window       -c "#{pane_current_path}"   # new window in the same folder

# ---------- move between panes with h/j/k/l ----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------- smart-splits: one set of keys for Neovim splits and tmux panes ----------
# If the pane runs Neovim (@pane-is-vim, set by the Neovim plugin), pass the key to Neovim;
# otherwise move between / resize tmux panes.
bind -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { select-pane -D }
bind -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { select-pane -U }
bind -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }

# Ctrl+Shift+h/j/k/l: resize by 1 (iTerm2 with extended keys sends these as C-S-H, C-S-J, …)
bind -n C-S-H if -F '#{@pane-is-vim}' { send-keys C-S-H } { resize-pane -L 1 }
bind -n C-S-J if -F '#{@pane-is-vim}' { send-keys C-S-J } { resize-pane -D 1 }
bind -n C-S-K if -F '#{@pane-is-vim}' { send-keys C-S-K } { resize-pane -U 1 }
bind -n C-S-L if -F '#{@pane-is-vim}' { send-keys C-S-L } { resize-pane -R 1 }

# Same movement keys inside copy mode
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl+l is taken by the movement above, so clear the shell screen with prefix + Ctrl+l
bind C-l send-keys C-l

# ---------- previous / next window (tab) without the prefix ----------
# Alt+Shift+h / Alt+Shift+l, like Barbar's H / L in Neovim (free there; tmux takes them everywhere)
# The same key arrives in different spellings depending on the terminal's key mode, so all are bound:
#   M-S-H  iTerm2 with extended keys (what this Mac sends: ESC[27;4;72~)
#   M-H    classic terminals (Esc + H)
#   M-S-h  terminals using the CSI-u key format
bind -n M-S-H previous-window
bind -n M-S-L next-window
bind -n M-H previous-window
bind -n M-L next-window
bind -n M-S-h previous-window
bind -n M-S-l next-window

# ---------- previous / next session (project) without the prefix ----------
# Alt+Shift+j next, Alt+Shift+k previous (like down / up). prefix ( and prefix ) still work.
# Same three spellings as the window keys above.
bind -n M-S-J switch-client -n
bind -n M-S-K switch-client -p
bind -n M-J switch-client -n
bind -n M-K switch-client -p
bind -n M-S-j switch-client -n
bind -n M-S-k switch-client -p

# ---------- defaults that moved ----------
bind q detach-client             # detach (default was prefix d)
# session + window list: prefix w (tmux default)

# ---------- copy mode: v selects, y copies to the macOS clipboard ----------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ---------- reload this file ----------
bind R source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---------- toggle the status bar ----------
bind b set-option status          # prefix b: hide / show the tmux bar

# ---------- plugins (TPM) ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'        # theme, pinned to a release as its docs recommend
set -g @catppuccin_flavor 'macchiato'          # same flavour as your Neovim
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix Ctrl+s save, prefix Ctrl+r restore
set -g @resurrect-capture-pane-contents 'on'   # also restore the text shown in panes

# window tabs: rounded on both sides, text = current folder name (the program is shown on the right)
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'                  # loads the plugins

# ---------- status bar content (after the theme has loaded) ----------
# session pill at the left edge: square at the screen corner, rounded on the right (like the
# Neovim mode pill); blue normally, red while the prefix is pressed
set -g status-left-length 50
set -g status-left "#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_blue}},bold] #S #[none]#[fg=#{?client_prefix,#{@thm_red},#{@thm_blue}},bg=#{@_ctp_status_bg}]\uE0B4#[none] "
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
# (the session name is shown on the left now)

# ---------- extras ----------
set -g @plugin 'alexwforsythe/tmux-which-key'   # prefix Space: menu of tmux actions (like which-key in Neovim)

# prefix g: LazyGit in a floating window, opened in the current folder
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# prefix f: pick a project folder and jump to its session (created on first use)
bind f display-popup -E -w 60% -h 60% "~/.tmux/scripts/tmux-project.sh"
